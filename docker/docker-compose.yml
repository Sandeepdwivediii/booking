services:
  db:
    image: postgres:17-alpine
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: bookingDB
      POSTGRES_USER: booking
      POSTGRES_PASSWORD: sandeep
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U booking -d bookingDB"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - ./data/db:/var/lib/postgresql/data

  app:
    build:
      context: ..
      dockerfile: Dockerfile
    image: booking-app:latest
    container_name: booking-app
    restart: unless-stopped
    env_file:
      - path: ../.env          # POSTGRES_PASSWORD (never committed); see .env.example
        required: false
    environment:
      POSTGRES_HOST: db
      DB_PORT: "5432"          # container-to-container port (host mapping uses DB_PORT from .env)
      POSTGRES_USER: booking
      POSTGRES_DB: ${APP_DB:-bookingDB}
      CATALOG_DIR: /app/data/catalog
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy

  adminer:
    image: adminer
    container_name: booking-adminer
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      db:
        condition: service_healthy